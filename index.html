<title>Cozy Corner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23101210'/%3E%3Cpath d='M14 53V11h36v42M38 32h4' fill='none' stroke='%23b64737' stroke-width='5'/%3E%3C/svg%3E">
<style>
:root{color-scheme:dark;--ink:#100c0d;--paper:#e3ded8;--muted:#b4aaa7;--red:#a32d38;--line:#675a5c;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);--ui-height:100dvh}

html,body{margin:0;width:100%;height:100vh;height:100dvh;overflow:hidden;overscroll-behavior:none;background:var(--ink);color:var(--paper);font-family:system-ui,-apple-system,"Noto Sans TC","Noto Sans JP",sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
body{position:fixed;inset:0}button,input{font:inherit}button{min-height:48px;border:1px solid var(--line);border-radius:2px;background:#191416;color:var(--paper);padding:8px 12px;cursor:pointer;touch-action:manipulation}button:active{background:#30262a}button:disabled{opacity:.42;cursor:default}button:focus-visible,input:focus-visible{outline:3px solid #e8c673;outline-offset:3px}button.primary{background:var(--paper);color:#171214;border-color:var(--paper);font-weight:750;letter-spacing:.12em}button.primary:active{background:#bcb4ae}button.danger{border-color:#a75b4e;color:#ffc0ac}button.small{font-size:12px;letter-spacing:.06em}[hidden]{display:none!important}
#world,#veil,#grain{position:absolute;inset:0;width:100%;height:100%;display:block}#world{z-index:0}#veil{z-index:2;pointer-events:none}#grain{z-index:3;pointer-events:none;opacity:.10;image-rendering:pixelated}#vignette{position:absolute;inset:0;z-index:4;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,transparent 20%,#0009 100%)}
.overlay{position:absolute;inset:0;z-index:30;padding:calc(16px + var(--safe-top)) 20px calc(16px + var(--safe-bottom));background:#100c0de8;display:grid;place-items:center}.sheet{width:min(100%,440px);display:flex;flex-direction:column;gap:12px;max-height:100%}.eyebrow{font:11px/1.4 ui-monospace,monospace;letter-spacing:.18em;color:var(--muted);margin:0}.languages{display:flex;gap:8px;align-items:center}.languages button{flex:1;font-size:12px;min-width:48px}.languages button[aria-pressed=true]{background:var(--paper);color:var(--ink);border-color:var(--paper)}.intro-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.intro-top .languages{width:190px;flex-shrink:0}.intro-title{position:relative;padding:4px 0 6px;border-bottom:1px solid var(--line)}h1{font-family:inherit;font-size:clamp(32px,7vw,46px);font-weight:650;line-height:1.1;letter-spacing:.03em;margin:0}html[lang=en] h1{font-size:clamp(28px,7.5vw,46px);letter-spacing:.04em}html[lang=ja] h1{font-size:clamp(38px,9vw,64px);letter-spacing:.04em}.intro-sub{margin:8px 0 0;color:var(--muted);font-size:13px;line-height:1.5}.stamp{position:absolute;right:0;top:6px;font:10px/1.4 ui-monospace,monospace;color:#536c5c;border:1px solid #b7cab9;padding:3px 6px;border-radius:12px}html[lang=en] .stamp,html[lang=ja] .stamp{position:static;display:inline-block;margin-top:8px}
.languages button{padding:8px 4px;white-space:nowrap}
.warning{border-left:3px solid #9bb59b;padding:0 0 0 12px}.warning h2{font-size:14px;margin:0 0 5px;color:#415345}.warning p{margin:0;font-size:13px;line-height:1.6}.permission-title{font-size:13px;line-height:1.5;margin:0}.options{display:grid;grid-template-columns:1fr 1fr;gap:8px}.option{display:flex;align-items:center;gap:9px;min-height:48px;border:1px solid var(--line);padding:8px;font-size:13px;cursor:pointer}.option input,.ack input{width:20px;height:20px;flex:0 0 20px;accent-color:#b95741;margin:0}.ack{display:flex;align-items:center;gap:9px;min-height:40px;font-size:13px;line-height:1.5;cursor:pointer}.privacy{font-size:11px;line-height:1.5;color:var(--muted);margin:0}.begin{width:100%;min-height:54px;display:flex;justify-content:space-between;align-items:center}.begin .arrow{font-size:24px;font-weight:400}.serial{font:10px/1.4 ui-monospace,monospace;color:var(--muted);letter-spacing:.08em}.intro-footer{display:flex;justify-content:space-between;gap:12px}#intro{color-scheme:light;--paper:#33453b;--ink:#f4f3ed;--muted:#55625a;--line:#c7d3c8;color:var(--paper);background:radial-gradient(ellipse at 90% 0,#dce8d7,transparent 65%),#f4f3ed}#intro button,#intro input{background:#fff;border-radius:12px;accent-color:#416f5d}#intro .option{background:#ffffff99;border-radius:10px}#intro .languages button[aria-pressed=true],#intro button.primary{background:#416f5d;color:#fff;border-color:#416f5d}#intro :focus-visible{outline-color:#416f5d}
#gameUI{position:absolute;inset:0;z-index:10;pointer-events:none}#gameUI button{pointer-events:auto}.game-top{position:absolute;top:calc(12px + var(--safe-top));left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.chapter{font:11px/1.5 ui-monospace,monospace;letter-spacing:.12em;color:#d8ced0}.chapter strong{display:block;color:#eee8e4;font-size:15px;letter-spacing:.02em;font-family:inherit;font-weight:500}.top-actions{display:flex;gap:8px}.top-actions button{padding:8px;min-width:48px;font-size:12px;background:#100c0dc9}.status{position:absolute;top:calc(80px + var(--safe-top));left:16px;right:16px;font:11px/1.5 ui-monospace,monospace;color:#c7bcbd;letter-spacing:.02em;pointer-events:none}.status:empty{display:none}.game-bottom{position:absolute;bottom:calc(12px + var(--safe-bottom));left:16px;right:16px;display:flex;flex-direction:column;gap:10px}.instruction{font-size:14px;line-height:1.6;margin:0;max-width:540px;text-shadow:0 2px 5px #000,0 0 12px #000}.instruction .label{font:10px/1.4 ui-monospace,monospace;letter-spacing:.18em;display:block;margin-bottom:4px;color:#c3b5b6}.toolbar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.toolbar button{font-size:12px;background:#191416e8;min-width:0;padding:8px 3px}.progress{height:3px;background:#5054428a;margin-bottom:2px;overflow:hidden}.progress div{height:100%;background:#c49671;width:0}.stage-action{align-self:flex-start;min-width:160px;padding:8px 16px;background:#1c1417e8}.toast{position:absolute;z-index:14;left:20px;right:20px;top:46%;text-align:center;font-family:Georgia,"Noto Serif TC",serif;font-size:18px;color:#ebd9c0;pointer-events:none;text-shadow:0 2px 8px #000,0 0 15px #000;line-height:1.6}.toast:empty{display:none}
#lockPanel{position:absolute;z-index:12;left:50%;width:min(78vw,310px);border:1px solid #7e7e65;padding:16px;background:#171115e8}.lock-title{font-size:12px;text-align:center;letter-spacing:.1em;margin:0 0 12px;color:#c4c4ac}.code{font:36px/1.3 ui-monospace,monospace;letter-spacing:.22em;color:#e8dddd;text-align:center;min-height:48px;margin-bottom:10px}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#scare{z-index:1000;background:#030303;padding:0}#scareCanvas{position:absolute;inset:0;width:100%;height:100%}#scareImage{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}#scareCaption{position:absolute;bottom:calc(110px + var(--safe-bottom));left:20px;right:20px;text-align:center;font-family:Georgia,"Noto Serif TC",serif;font-weight:900;font-size:clamp(34px,11vw,80px);line-height:1.05;color:#f7593f;text-shadow:2px 2px #060000;pointer-events:none}.scare-controls{position:absolute;top:calc(12px + var(--safe-top));right:16px;display:flex;gap:8px;z-index:1002}.scare-controls button{background:#0b0b0be8;border-color:#baafa0;font-size:13px}.scare-continue{position:absolute;bottom:calc(28px + var(--safe-bottom));left:50%;transform:translateX(-50%);z-index:1002;min-width:180px}#pauseScreen{z-index:1100}.pause-title{font:32px/1.4 Georgia,"Noto Serif TC",serif;margin:0}.pause-copy{line-height:1.7;font-size:14px;color:var(--muted);margin:0}.pause-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}#ending{z-index:40}.ending-number{font:12px/1.5 ui-monospace,monospace;letter-spacing:.16em;color:#cd7b62}.ending-title{font:clamp(30px,8vw,50px)/1.25 Georgia,"Noto Serif TC","Noto Serif JP",serif;margin:0;color:#ece0c4}.ending-copy{font-size:15px;line-height:1.9;margin:8px 0;color:#d6ceb6}.ending-actions{display:flex;gap:8px;flex-direction:column}.artifact{width:72px;height:72px;border:1px solid #947d56;display:grid;place-items:center;margin:8px 0;color:#d0b276}.artifact svg{width:44px;height:44px}.end-legal{font-size:11px;color:var(--muted);line-height:1.6;margin:0}
@media(max-height:700px) and (orientation:portrait){.overlay{padding:calc(10px + var(--safe-top)) 16px calc(10px + var(--safe-bottom))}.sheet{gap:8px}.intro-sub{font-size:12px;margin-top:4px}.warning p{font-size:12px;line-height:1.5}.privacy{font-size:10px}.intro-title{padding-bottom:4px}.intro-top .eyebrow{font-size:9px}.option{font-size:12px;min-height:48px;padding:6px}.begin{min-height:50px}.game-bottom{gap:6px}.instruction{font-size:12px}.game-top{top:calc(8px + var(--safe-top))}.status{top:calc(70px + var(--safe-top))}}

@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
/* 小螢幕壓縮間距，仍保留至少 48 px 的可操作按鈕。 */
@media(max-height:700px) and (orientation:portrait){.sheet{gap:6px}}
@media(orientation:landscape) and (max-height:560px){.keys button,.stage-action{min-height:48px}}
/* 二週目不是原首頁換字：獨立暗紅入口，保留玩家對效果與權限的選擇。 */
#curseIntro{background:#1b0409;color:#edb6a0}body.cursed{background:#1b0409}
#curseIntro .ack{min-height:48px}#curseIntro .sheet{gap:10px}#curseIntro .languages{width:100%}#curseIntro .languages button{flex:1}
.curse-message{font:clamp(23px,6vw,32px)/1.45 Georgia,"Noto Serif TC","Noto Serif JP",serif;color:#f36656;border:0;border-bottom:1px solid #793d33;background:transparent;padding:8px 0 14px;text-align:center;min-height:72px;touch-action:none}
.curse-message:active{background:transparent}.curse-warning{font-size:12px;line-height:1.5;margin:0;color:#e0baa6}
.curse-memory{font:11px/1.5 ui-monospace,monospace;letter-spacing:.1em;color:#b58272;margin:0;text-align:center}
#purifyWash{position:absolute;inset:0;z-index:1200;background:white;pointer-events:none;opacity:0;transition:opacity .25s ease}
.storage-notice{color:#edc07f;font-size:11px;line-height:1.4;margin:0}
/* 儲存拒絕的提示取代正常首頁的附註，避免 320×568 額外一行擠掉開始按鈕。 */
body.storage-blocked #intro .privacy{display:none}
@media(max-height:700px) and (orientation:portrait){#curseIntro .sheet{gap:6px}.curse-message{font-size:22px;line-height:1.3;padding:6px 0 10px}.curse-warning{font-size:11px}.curse-memory{font-size:10px}#curseIntro .privacy{font-size:10px}}
@media(orientation:landscape) and (max-height:560px){#curseIntro .sheet{width:min(100%,860px);display:grid;grid-template-columns:1fr 1fr;gap:6px 20px}#curseIntro .languages{grid-column:1/-1}#curseMessage{grid-column:1;grid-row:2/4;align-self:center}#curseIntro .curse-memory{grid-column:1;grid-row:4}#curseIntro .curse-warning,#curseIntro .options,#curseIntro .age,#curseContinue{grid-column:2}#curseIntro .privacy,#curseStorageNotice{grid-column:1;grid-row:5;align-self:end}.curse-message{font-size:25px}}
@media(orientation:landscape) and (max-height:560px){#intro #storageNotice{grid-column:1;grid-row:4;align-self:end}#curseStorageNotice{grid-row:6;align-self:start}}
/* 四位生日代碼只在入口使用原生鍵盤；門鎖全是 HTML button。 */
.birthday-row{display:grid;grid-template-columns:1fr 100px;gap:10px;align-items:center}.birthday-row label{font-size:12px;line-height:1.4}.birthday-row small{display:block;color:var(--muted);font-size:10px;line-height:1.4;margin-top:3px}.birthday-row input{min-width:0;width:100%;height:48px;background:#100c0d;border:1px solid var(--line);border-radius:2px;color:var(--paper);text-align:center;font:20px ui-monospace,monospace;letter-spacing:.12em;padding:8px;user-select:text;touch-action:manipulation}.birthday-row input[aria-invalid=true]{border-color:#d96a53}
#lockPanel{top:46%;transform:translate(-50%,-50%);padding:14px}.lock-title{color:#ee7760;line-height:1.4}.keys button{font:22px ui-monospace,monospace;background:linear-gradient(#33292d,#1b1418);box-shadow:inset 0 1px #998a8d40,0 3px #0b0709}.keys #clearCode,.keys #openDoor{font:12px/1.3 system-ui,sans-serif}.keys #openDoor{background:#4b2019;color:#ffd0b0;border-color:#b35743}.fractured .keys button{opacity:.12;transform:translateY(18px) rotate(-9deg);transition:transform .5s ease,opacity .5s ease}.fractured .keys button:nth-child(even){transform:translateY(-13px) rotate(12deg)}
#lockout{z-index:1050;background:#000;text-align:center}#lockout .sheet{align-items:center;gap:18px}#lockoutCounter{font:clamp(76px,24vw,124px)/1 ui-monospace,monospace;color:#e33d2c;text-shadow:0 0 24px #9b11064d}#lockoutCopy{font:16px/1.8 Georgia,"Noto Serif TC",serif;color:#d64b3b;margin:0}.lockout-controls{position:absolute;top:calc(12px + var(--safe-top));right:16px;display:flex;gap:8px}.lockout-controls button{font-size:12px;background:#101010;min-width:48px}.lock-flash{animation:lock-pulse .3s ease-out 1}@keyframes lock-pulse{from{background:#791a10}to{background:#000}}
@media(prefers-reduced-motion:reduce){.fractured .keys button{transform:none!important}}
@media(max-height:700px) and (orientation:portrait){#intro .intro-sub,#intro .permission-title,#intro .intro-footer,#intro .stamp{display:none}#intro h1{font-size:42px}html[lang=en] #intro h1{font-size:27px}html[lang=ja] #intro h1{font-size:34px}.birthday-row{grid-template-columns:1fr 88px;gap:8px}.birthday-row label{font-size:11px;line-height:1.3}.birthday-row small{line-height:1.25;margin-top:2px}#lockPanel{padding:12px}.code{font-size:30px;min-height:40px}.lock-title{font-size:12px}}
@media(orientation:landscape) and (max-height:560px){#intro .sheet{gap:4px 20px}#intro .birthday-row{grid-column:1;grid-row:5}#intro .intro-footer{display:none}#curseIntro .birthday-row{grid-column:1;grid-row:5}#curseIntro .privacy{grid-row:6}#curseStorageNotice{grid-row:7}#lockPanel{left:60%;top:44%;width:270px;padding:8px}.lock-title{font-size:11px;margin-bottom:4px}.code{font-size:26px;min-height:32px;margin-bottom:6px}.keys{gap:4px}.birthday-row label{font-size:11px}.birthday-row small{font-size:10px}#lockout .sheet{gap:8px}#lockoutCounter{font-size:76px}}
.age{display:flex;align-items:center;gap:8px}.age .ack{flex:1;font-size:12px}.minor{flex-shrink:0}
#intro .storage-notice{color:#71512b}
</style>
</head>
<body>
<canvas id="world" aria-hidden="true"></canvas>
<canvas id="veil" aria-hidden="true"></canvas>
<canvas id="grain" width="128" height="192" aria-hidden="true"></canvas>
<div id="vignette" aria-hidden="true"></div>

<section id="intro" class="overlay" hidden aria-labelledby="introTitle">
 <div class="sheet">
  <div class="intro-top"><p class="eyebrow">COZY CORNER<br>TAKE A BREATH</p><nav class="languages" aria-label="Language"><button data-lang="zh" aria-pressed="true">中文</button><button data-lang="en" aria-pressed="false">EN</button><button data-lang="ja" aria-pressed="false">日本語</button></nav></div>
  <div class="intro-title"><span class="stamp" data-i18n="stamp"></span><h1 id="introTitle" data-i18n="welcome"></h1><p class="intro-sub" data-i18n="tagline"></p></div>
  <div class="warning"><h2 data-i18n="warningTitle"></h2><p data-i18n="warningBody"></p></div>
  <p class="permission-title" data-i18n="permissionTitle"></p>
  <div class="options">
   <label class="option"><input id="allowSound" type="checkbox" checked><span data-i18n="soundOption"></span></label>
   <label class="option"><input id="allowMotion" type="checkbox"><span data-i18n="motionOption"></span></label>
   <label class="option"><input id="allowVibrate" type="checkbox"><span data-i18n="vibrateOption"></span></label>
   <label class="option"><input id="allowFlash" type="checkbox"><span data-i18n="flashOption"></span></label>
  </div>
  <p class="privacy" data-i18n="privacy"></p>
  <p id="storageNotice" class="storage-notice" data-i18n="storageUnavailable" hidden></p>
  <div class="birthday-row"><label for="birthday"><span data-i18n="birthdayLabel"></span><small data-i18n="birthdayHelp"></small></label><input id="birthday" type="text" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="0618" aria-invalid="false"></div>
  <div class="age"><label class="ack"><input id="acknowledge" type="checkbox"><span data-i18n="ack"></span></label><button class="small minor" data-i18n="minor"></button></div>
  <button id="start" class="primary begin" disabled><span data-i18n="start"></span><span class="arrow" aria-hidden="true">→</span></button>
  <div class="intro-footer"><span class="serial">TAKE YOUR TIME</span><span class="serial" data-i18n="duration"></span></div>
 </div>
</section>

<!-- 正常首頁先隱藏，DOMContentLoaded 讀取狀態後只顯示其中一個入口。 -->
<section id="curseIntro" class="overlay" hidden aria-labelledby="curseMessage">
 <div class="sheet">
  <nav class="languages" aria-label="Language"><button data-lang="zh">中文</button><button data-lang="en">EN</button><button data-lang="ja">日本語</button><button id="curseLeave" class="danger" data-i18n="exit"></button></nav>
  <button id="curseMessage" class="curse-message" aria-describedby="curseMemory"></button>
  <p id="curseMemory" class="curse-memory" data-i18n="curseMemory"></p>
  <p class="curse-warning" data-i18n="curseWarning"></p>
  <div class="options">
   <label class="option"><input id="curseSound" type="checkbox" checked><span data-i18n="soundOption"></span></label>
   <label class="option"><input id="curseMotion" type="checkbox"><span data-i18n="motionOption"></span></label>
   <label class="option"><input id="curseVibrate" type="checkbox"><span data-i18n="vibrateOption"></span></label>
   <label class="option"><input id="curseFlash" type="checkbox"><span data-i18n="flashOption"></span></label>
  </div>
  <p id="curseStorageNotice" class="storage-notice" data-i18n="storageUnavailable" hidden></p>
  <div class="birthday-row"><label for="curseBirthday"><span data-i18n="birthdayLabel"></span><small data-i18n="birthdayHelp"></small></label><input id="curseBirthday" type="text" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="0618" aria-invalid="false"></div>
  <div class="age"><label class="ack"><input id="curseAcknowledge" type="checkbox"><span data-i18n="ack"></span></label><button class="small minor" data-i18n="minor"></button></div>
  <button id="curseContinue" class="primary begin" disabled><span data-i18n="curseContinue"></span><span class="arrow" aria-hidden="true">→</span></button>
  <p class="privacy" data-i18n="cursePrivacy"></p>
 </div>
</section>
<section id="restScreen" class="overlay" hidden aria-labelledby="restTitle"><div class="sheet"><h2 id="restTitle" class="pause-title" data-i18n="restTitle"></h2><p class="pause-copy" data-i18n="restCopy"></p><button id="returnEntry" data-i18n="returnEntry"></button></div></section>
<div id="purifyWash" hidden aria-hidden="true"></div>

<main id="gameUI" hidden aria-label="Game">
 <header class="game-top"><div class="chapter"><span id="chapterNumber">01 / 03</span><strong id="chapterTitle"></strong></div><div class="top-actions"><button id="language" class="small">中文</button><button id="hint" class="small" data-i18n="hint"></button></div></header>
 <div id="sensorStatus" class="status" role="status" aria-live="polite"></div>

/* ---- 30 秒鎖定：存「到期時間」，不能用每秒減一來抵抗背景計時器限速 ----

   localStorage 不因重整消失，重開分頁也不會得到新的 30 秒或直接解除。
   這只阻止正常重整跳過遊戲懲罰；使用者仍可清除儲存或修改本機時鐘。

 }catch{return false}

}

 ctx.fillStyle='#130b10';ctx.fillRect(x+w*.39,y+h*.14,w*.22,24);ctx.fillStyle='#d3bec8';ctx.font='14px ui-monospace, monospace';ctx.textAlign='center';ctx.fillText('003',W*.5,y+h*.14+17);
 ctx.fillStyle='#bd9faa';ctx.beginPath();ctx.arc(x+w*.87,y+h*.6,5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#050205';ctx.fillRect(x+w-5,y+4,5,h-8);vctx.clearRect(0,0,W,H);
}
function addDigit(digit){if(state.mode!=='lock'||state.paused||state.scare||state.code.length>=4||!/^\d$/.test(digit))return;state.code+=digit;$('codeDisplay').textContent=state.code.padEnd(4,'—').split('').join(' ');tone(160+Number(digit)*25,.09,.05)}
function checkDoor(){
 if(state.mode!=='lock'||state.paused||state.scare)return;if(state.code.length!==4){say('needCode',3);return}
 // 字串比較保留 0618 等前導零；固定備用碼可避免忘記月日而永遠卡關。
 if(state.code===readBirthday()||state.code==='0618'){state.victory=true;$('lockPanel').classList.add('fractured');triggerScare('scareFinal');return}
 beginLockout();
}

const ghost=document.createElement('canvas');ghost.width=560;ghost.height=780;
function buildGhost(){
 const c=ghost.getContext('2d'),r=seeded(666);c.fillStyle='#030303';c.fillRect(0,0,560,780);
 // 鬼臉快取一次：不對稱五官、過寬笑容，黑白交叉排線代替光滑皮膚。
 c.fillStyle='#b2aeae';c.beginPath();c.moveTo(176,518);c.lineTo(48,658);c.lineTo(15,780);c.lineTo(540,780);c.lineTo(509,633);c.lineTo(369,509);c.fill();
 c.strokeStyle='#171515';for(let i=0;i<90;i++){c.lineWidth=1+r()*4;c.beginPath();c.moveTo(90+r()*360,552+r()*90);c.lineTo(30+r()*500,780);c.stroke()}
 c.fillStyle='#090909';c.beginPath();c.ellipse(283,338,197,312,-.07,0,Math.PI*2);c.fill();
 let g=c.createLinearGradient(145,180,414,390);g.addColorStop(0,'#555151');g.addColorStop(.34,'#ece8e6');g.addColorStop(.70,'#c3babb');g.addColorStop(1,'#2a2426');
 c.save();c.beginPath();c.ellipse(281,330,133,219,.055,0,Math.PI*2);c.clip();c.fillStyle=g;c.fillRect(120,95,320,490);
 // 兩層傾斜墨線，在臉緣聚密；中央留白，使眼神與笑容可讀。
 for(let i=0;i<1800;i++){const x=143+r()*280,y=130+r()*419,edge=Math.abs(x-281)/133;c.strokeStyle=r()<edge?'#110c0e66':'#302a2c26';c.lineWidth=.5+r();c.beginPath();c.moveTo(x,y);c.lineTo(x+(i%2?1:-1)*(4+edge*16),y+7+edge*21);c.stroke()}c.restore();
 for(const [x,y,rx,ry,rot] of [[224,295,40,14,-.18],[339,289,33,23,.13]]){g=c.createRadialGradient(x,y,8,x,y,rx+20);g.addColorStop(0,'#090608');g.addColorStop(.65,'#20181dcc');g.addColorStop(1,'#20181d00');c.fillStyle=g;c.beginPath();c.ellipse(x,y,rx+22,ry+28,rot,0,Math.PI*2);c.fill();c.fillStyle='#eae5e5';c.beginPath();c.ellipse(x,y,rx,ry,rot,0,Math.PI*2);c.fill();c.strokeStyle='#090608';c.lineWidth=4;c.beginPath();c.ellipse(x,y,rx,ry,rot,Math.PI,Math.PI*2);c.stroke();c.lineWidth=.8;for(let i=0;i<40;i++){const u=x-rx+r()*rx*2,v=y+ry+2+r()*16;c.beginPath();c.moveTo(u,v);c.lineTo(u-7,v+14+r()*23);c.stroke()}}
 for(const [x,y] of [[231,299],[325,291]]){c.fillStyle='#080606';c.beginPath();c.ellipse(x,y,5,13,-.1,0,Math.PI*2);c.fill();c.fillStyle='#a52d49';c.fillRect(x-1,y-4,2,2)}
 c.strokeStyle='#382d30';c.lineWidth=2;c.beginPath();c.moveTo(287,312);c.bezierCurveTo(268,355,270,372,302,380);c.stroke();c.fillStyle='#2d2026';for(const x of [278,299]){c.beginPath();c.ellipse(x,377,5,2,.2,0,Math.PI*2);c.fill()}
 // 嘴角上揚到臉側，齒列沿弧線排列；不是原來的張嘴尖叫橢圓。
 c.fillStyle='#10090c';c.beginPath();c.moveTo(167,367);c.bezierCurveTo(218,428,346,432,404,353);c.bezierCurveTo(394,461,225,490,167,367);c.fill();
 c.save();c.clip();c.strokeStyle='#e5dbde';c.lineWidth=5;
 for(let i=0;i<25;i++){const x=176+i*9,y=365+49*Math.sin((i/24)*Math.PI)-i*.35;c.beginPath();c.moveTo(x,y);c.lineTo(x+2,y+12+r()*13);c.stroke()}c.restore();
 c.strokeStyle='#4d1d28';c.lineWidth=3;c.beginPath();c.moveTo(166,367);c.bezierCurveTo(216,428,347,432,405,353);c.stroke();
 c.strokeStyle='#2d1c2288';c.lineWidth=1;for(let i=0;i<32;i++){const side=i%2?-1:1,x=280+side*(57+r()*55),y=336+r()*152;c.beginPath();c.moveTo(x,y);c.lineTo(x+side*(10+r()*17),y-12-r()*12);c.stroke()}
 for(let i=0;i<240;i++){const x=105+r()*350,side=x<281?-1:1;if(x>240&&x<373)continue;c.strokeStyle=i%6===0?'#62585b':'#080608';c.lineWidth=.6+r()*3;c.beginPath();c.moveTo(x,112+r()*54);c.bezierCurveTo(x+side*40,216,x+side*70,394,x+side*(24+r()*55),553+r()*205);c.stroke()}
 // 狹長手指保留獨立指節與暗指甲，衣服及臉的墨線共用固定種子。
 for(const side of [-1,1]){c.save();c.translate(side<0?45:515,680);c.scale(side,1);c.rotate(-.19);for(let i=0;i<5;i++){const x=-22+i*17,len=80+Math.sin(i*.8)*45;c.strokeStyle='#ada3a6';c.lineWidth=13-i*.7;c.lineCap='round';c.beginPath();c.moveTo(x,12);c.lineTo(x+8,-len*.48);c.lineTo(x-2,-len);c.stroke();c.strokeStyle='#35272c';c.lineWidth=2;c.beginPath();c.moveTo(x-5,-len*.48);c.lineTo(x+8,-len*.48);c.stroke();c.fillStyle='#160e12';c.fillRect(x-5,-len-7,6,10)}c.restore()}
}
buildGhost();
function showScare(){
 if(!state.scare||state.scare.shown||state.paused)return;state.scare.shown=true;if(state.scare.key==='scareFinal')clearVictoryStorage();else rememberScare();$('scare').hidden=false;$('scareCaption').textContent=tr(state.scare.key);$('scareContinue').focus({preventScroll:true});gain(state.muted?0:1);scream();
 $('gameUI').inert=true;$('lockPanel').inert=true;
 if(state.consent.vibrate&&typeof navigator.vibrate==='function'){try{navigator.vibrate([500,200,500])}catch{}}
 if(ASSETS.enabled&&!$('scareImage').src){const img=$('scareImage');img.onload=()=>{if(state.scare?.shown)img.hidden=false};img.onerror=()=>{img.hidden=true};img.src=ASSETS.ghost}
}
function triggerScare(key,instant=false){
 if(state.scare||state.paused||isEntry()||state.mode==='ending')return;
 const start=state.clock+(instant?0:.85);state.scare={key,start,end:start+1.85,shown:false};gesture=null;silenceEffects();gain(0);if(instant)showScare();
}
function dismissScare(){if(!state.scare)return;const final=state.scare.key==='scareFinal';state.scare=null;$('scare').hidden=true;$('scareImage').hidden=true;$('gameUI').inert=false;$('lockPanel').inert=false;silenceEffects();if(typeof navigator.vibrate==='function')navigator.vibrate(0);gain(state.muted?0:1);updateUI();if(final){finishGame();return}$('hint').focus({preventScroll:true})}
// 固定掃描線；局部撕裂用遊戲時間，所以暫停完全凍結。減少動態只留靜態線。
function tape(c){
 c.fillStyle='#0004';for(let y=0;y<H;y+=4)c.fillRect(0,y,W,1);
 const t=state.clock;if(reducedMotion.matches||isEntry()||state.mode==='ending')return;
 if(t%3.7<.22){const y=H*(.23+(Math.floor(t/3.7)%3)*.2),h=12+H*.02;c.drawImage(c.canvas,0,y*DPR,W*DPR,h*DPR,11,y,W,h);c.fillStyle='#91213a24';c.fillRect(0,y,W,h)}
}
function drawScare(){
 const c=$('scareCanvas').getContext('2d'),t=Math.max(0,state.clock-state.scare.start),still=reducedMotion.matches;
 c.fillStyle='#040305';c.fillRect(0,0,W,H);const scale=Math.max(W/560,H/780)*(1+(still?0:Math.min(.16,t*.08))),w=560*scale,h=780*scale,x=(W-w)/2+(still?0:Math.sin(t*31)*2),y=(H-h)/2+(still?0:Math.cos(t*27)*2);
 c.save();if(state.scare.key==='scareFinal'){c.translate(W,H);c.rotate(Math.PI)}c.drawImage(ghost,x,y,w,h);c.restore();
 // 同意閃光才有慢紅色脈衝；無閃光版本仍以靜態笑臉及局部錯位營造不安。
 if(state.consent.flash&&!still&&t%1<.12){c.fillStyle='#aa163a35';c.fillRect(0,0,W,H)}tape(c);
}
let lastBeat=0,lastKnock=0;
function tickGame(){
 if(state.scare){if(!state.scare.shown&&state.clock>=state.scare.start)showScare();if(state.scare&&state.clock>=state.scare.end)dismissScare();return}
 const t=state.clock-state.stageStart;
 // 正常十秒、四次以上三秒；最後 0.85 秒全靜音，滿秒才顯示並記錄驚嚇。
 if(state.mode==='corridor'&&!state.countdownScared&&t>=countdownSeconds()-.85){state.countdownScared=true;triggerScare('scareCountdown');return}
 if(state.mode==='corridor'&&t>9&&state.clock-lastKnock>8){lastKnock=state.clock;tone(170,.06,.15,'triangle');tone(145,.05,.10,'triangle',.22)}
 if((state.mode==='wall'||state.mode==='lock')&&state.clock-lastBeat>(state.mode==='lock'?.75:1.5)){lastBeat=state.clock;tone(48,.16,.11);tone(54,.12,.07,'sine',.16)}
}
function finishGame(){
 state.session++;
 state.mode='ending';state.scare=null;stopSensor();stopAudio();if(typeof navigator.vibrate==='function')navigator.vibrate(0);$('gameUI').hidden=true;$('lockPanel').hidden=true;$('scare').hidden=true;$('ending').hidden=false;$('shareStatus').textContent='';
 // 破關已 clear()；此處只顯示結局，不再寫回已清除的紀錄。
 renderEnding();$('replay').focus({preventScroll:true});
}
function renderEnding(){const suffix=state.seal?'B':'A';$('endingNumber').textContent=tr('ending'+suffix);$('endingTitle').textContent=tr('gameCleared')+' · '+tr('endingTitle'+suffix);$('endingCopy').textContent=tr('endingCopy'+suffix)}
async function shareEntrance(){
 if(location.protocol==='file:'){$('shareStatus').textContent=tr('shareFile');return}
 // 入口必經警告，不可把分享連結指到已解鎖的驚嚇場景。
 const u=new URL(location.href);u.searchParams.set('lang',lang);const data={title:tr('title'),text:tr('shareText'),url:u.href};
 if(navigator.share){try{await navigator.share(data);return}catch(e){if(e.name==='AbortError')return}}
 try{await navigator.clipboard.writeText(u.href);$('shareStatus').textContent=tr('shared')}catch{$('shareStatus').textContent=tr('shareFailed')}
}

document.querySelectorAll('.minor').forEach(b=>b.onclick=()=>location.assign('https://www.youtube.com/watch?v=hkQcoXDpJbA&list=RDhkQcoXDpJbA&start_radio=1'));
$('acknowledge').addEventListener('change',entryGate);$('start').addEventListener('click',startGame);
$('curseAcknowledge').addEventListener('change',entryGate);$('curseContinue').addEventListener('click',startGame);
document.querySelectorAll('[data-lang]').forEach(el=>el.addEventListener('click',()=>setLanguage(el.dataset.lang)));
$('language').addEventListener('click',()=>setLanguage({zh:'en',en:'ja',ja:'zh'}[lang]));$('hint').addEventListener('click',()=>say('hint'+({corridor:1,wall:2,lock:3}[state.mode]||1),6));
for(const id of ['mute','scareMute'])$(id).addEventListener('click',toggleMute);
for(const id of ['exit','scareExit','pauseExit','replay'])$(id).addEventListener('click',exitGame);
$('pause').addEventListener('click',pauseGame);$('resume').addEventListener('click',resumeGame);
$('recenter').addEventListener('click',()=>{sensor.base=null;targetLight={x:W/2,y:area.y+area.h/2};light={...targetLight};say('motionReset',2)});
$('stageAction').addEventListener('click',()=>{if(state.paused||state.scare)return;if(state.mode==='corridor')hitTest(light.x,light.y);else if(state.mode==='wall'){if(state.wallScared&&state.coverage>=.42)enterLock();else assistWipe()}});
$('scareContinue').addEventListener('click',dismissScare);document.querySelectorAll('[data-digit]').forEach(el=>el.addEventListener('click',()=>addDigit(el.dataset.digit)));
$('clearCode').addEventListener('click',()=>{state.code='';$('codeDisplay').textContent='— — —'});$('openDoor').addEventListener('click',checkDoor);$('share').addEventListener('click',shareEntrance);
window.addEventListener('resize',resize);window.visualViewport?.addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelPurification();pauseGame()}else if(state.mode==='locked')lockTick()});window.addEventListener('pagehide',()=>{cancelPurification();stopSensor();stopAudio();if(typeof navigator.vibrate==='function')navigator.vibrate(0)});
window.addEventListener('pageshow',e=>{if(e.persisted){if(loadLockout()){if(lockout.until>Date.now())showLocked();else restoreLock()}else exitGame()}});
window.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.mode==='locked')leaveLockout();else pauseGame();return}if(e.target instanceof HTMLInputElement||state.paused||state.scare)return;if(state.mode==='corridor'&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();sensor.touchUntil=performance.now()+1000;targetLight.x=clamp(targetLight.x+({ArrowLeft:-24,ArrowRight:24}[e.key]||0),0,W);targetLight.y=clamp(targetLight.y+({ArrowUp:-24,ArrowDown:24}[e.key]||0),area.y,area.y+area.h)}if(state.mode==='lock'&&/^[0-9]$/.test(e.key))addDigit(e.key)});
document.addEventListener('keydown',e=>{if(e.key!=='Tab')return;const active=['pauseScreen','lockout','scare','intro','curseIntro','restScreen','ending'].map($).find(el=>!el.hidden);if(!active)return;const controls=[...active.querySelectorAll('button:not(:disabled),input')].filter(el=>!el.hidden),first=controls[0],last=controls.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}});
// 使用自有、非敏感狀態供本機 QA 讀取；正式頁不暴露強制跳關操作。
Object.defineProperty(window,'gameDiagnostics',{get:()=>({mode:state.mode,paused:state.paused,lang,sensor:sensor.status,sensorListening:sensor.listening,audioState:sound.ctx?.state||'none',audioGain:sound.master?.gain.value||0,mediaPaused:sound.media?.paused??true,muted:state.muted,consent:{...state.consent},curseStatus:curse.status,deathCount:curse.deathCount,firstVisit:curse.firstVisit,storageAvailable:curse.available,heavyCurse:state.heavyCurse,beamRadius:beamRadius(),countdownSeconds:countdownSeconds(),ambientRate:sound.ambient?.source.playbackRate.value??null,mediaRate:sound.media?.playbackRate??null,lockUntil:lockout.until,lockRemaining:lockout.remaining,victory:state.victory,clock:state.clock,wipeTime:state.wipeTime,wallScared:state.wallScared,coverage:state.coverage,seal:state.seal,scare:state.scare?.shown||false,scarePending:!!state.scare&&!state.scare.shown,area:{...area},light:{...light},frameP95:frameCosts.length?[...frameCosts].sort((a,b)=>a-b)[Math.floor(frameCosts.length*.95)]:0,frameMax:frameCosts.length?Math.max(...frameCosts):0})});
// DOMContentLoaded 第一時間讀持久化狀態，正常歡迎與開始按鈕不會先閃出來。
function boot(){readCurse();saveCurse();readBirthday();renderEntry();setLanguage(lang,false);resize();updateGrain();if(loadLockout()){if(lockout.until>Date.now())showLocked();else restoreLock()}raf=requestAnimationFrame(loop)}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
// 另一個同來源分頁更新紀錄時，只刷新入口；不打斷正在玩的場景。
window.addEventListener('storage',e=>{if(['horror_player_status','death_count','horror_first_visit',null].includes(e.key)&&['intro','curse'].includes(state.mode))renderEntry()});
</script>
