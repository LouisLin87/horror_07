/* 用 ID 前綴限定作用範圍，不改宿主頁的 button、body 或文字。 */
#cozy-monitor,#cozy-monitor *{box-sizing:border-box}
#cozy-monitor{
  --ccm-ink:#233447;--ccm-muted:#596b7c;--ccm-safe:#236c4d;
  position:fixed;right:calc(20px + env(safe-area-inset-right,0px));
  bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:35;
  width:340px;max-width:100%;border:1px solid #d4e0e8;border-radius:16px;
  color:var(--ccm-ink);color-scheme:light;background:#f8fbff;
  box-shadow:0 8px 32px #28435b12,0 1px 4px #28435b08;
  font:13px/1.5 system-ui,-apple-system,"Noto Sans TC","Noto Sans JP",sans-serif;
}
#cozy-monitor[hidden]{display:none!important}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  #cozy-monitor{background:#f8fbfff0;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
}
#cozy-monitor .ccm-header{
  display:flex;align-items:center;gap:10px;min-height:48px;padding:12px 16px;
  list-style:none;cursor:pointer;font:11px/1.6 ui-monospace,monospace;letter-spacing:.02em;
}
#cozy-monitor .ccm-title{min-width:0;overflow-wrap:anywhere}

#cozy-monitor .ccm-chevron{margin-left:auto;font-size:16px}
#cozy-monitor[open] .ccm-chevron{transform:rotate(180deg)}
#cozy-monitor .ccm-dot{
  width:8px;height:8px;flex:0 0 8px;border-radius:50%;background:#287d58;
  box-shadow:0 0 0 4px #287d5812;animation:ccm-breathe 4s ease-in-out infinite;
}
#cozy-monitor .ccm-content{padding:0 16px 16px}
#cozy-monitor .ccm-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:0}
#cozy-monitor .ccm-status{grid-column:1/-1;border-top:1px solid #dce6ec;padding-top:12px}

node-state\">OPTIMAL<\/span><span id=\"node-comfort\">99.8%<\/span><\/div>\n    <div class=\"tools\" aria-label=\"Game controls\">\n      <label><span class=\"support-note\" data-i18n=\"language\">語言<\/span> <select id=\"language\" aria-label=\"Language\"><option value=\"zh\">中文<\/option><option value=\"en\">EN<\/option><option value=\"ja\">日本語<\/option><\/select><\/label>\n      <button id=\"copy-current\" data-i18n=\"copy\" disabled>複製程式碼<\/button>\n      <button id=\"pause\" data-i18n=\"pause\" disabled>暫停<\/button>\n      <button id=\"reset\" data-i18n=\"reset\" disabled>重置<\/button>\n      <button id=\"exit\" data-i18n=\"exit\">退出<\/button>\n    <\/div>\n  <\/div>\n<\/header>\n<div id=\"abyss\" hidden aria-hidden=\"true\"><canvas id=\"runes\"><\/canvas><\/div>\n<canvas id=\"wax\" hidden aria-hidden=\"true\"><\/canvas>\n<div id=\"abyss-message\" hidden>\n  <div class=\"serial\">A_01_E / SANCTUARY_NODE / 0004<\/div>\n  <h2 data-i18n=\"abyssTitle\">文件不應該記得你。<\/h2>\n  <p data-i18n=\"abyssBody\">你正在閱讀的，是一份用你的意識寫成的文件。<\/p>\n  <p lang=\"en\">IT IS A CAGE. YOU CANNOT LEAVE.<\/p><p id=\"subject-key\"><\/p><p id=\"fatal-line\" hidden><\/p>\n<\/div>\n<main id=\"paper\" inert>\n <div class=\"doc-grid\">\n  <nav class=\"sidebar\" aria-label=\"Documentation\"><strong data-i18n=\"navTitle\">JavaScript 指南<\/strong><a href=\"#overview\" data-i18n=\"overview\">概觀<\/a><a href=\"#create\" data-i18n=\"create\">建立庇護實例<\/a><a href=\"#sync\" data-i18n=\"sync\">非同步狀態同步<\/a><a href=\"#contract\" data-i18n=\"contract\">介面契約<\/a><a href=\"#troubleshooting\" data-i18n=\"troubleshooting\">疑難排解<\/a><\/nav>\n  <article>\n   <details class=\"mobile-nav\"><summary data-i18n=\"navTitle\">JavaScript 指南<\/summary><a href=\"#create\" data-i18n=\"create\">建立庇護實例<\/a><a href=\"#sync\" data-i18n=\"sync\">非同步狀態同步<\/a><a href=\"#contract\" data-i18n=\"contract\">介面契約<\/a><a href=\"#troubleshooting\" data-i18n=\"troubleshooting\">疑難排解<\/a><\/details>\n   <div class=\"breadcrumb\">A_01_E / JavaScript / Sanctuary API<\/div>\n   <div id=\"overview\"><h1 data-i18n=\"title\">建立穩定的 JavaScript 執行環境<\/h1><div class=\"metadata\"><span data-i18n=\"date\">文件版本：2026/10/14<\/span><span data-i18n=\"reading\">閱讀時間：6 分鐘<\/span><span>API v1.4.28<\/span><\/div><p class=\"intro\" data-i18n=\"intro\">透過可預測的狀態管理與非同步操作，為每個使用者提供一致、可靠的庇護環境。<\/p><\/div>\n   <aside class=\"callout\"><strong data-i18n=\"noteTitle\">注意事項<\/strong><p data-i18n=\"noteBody\">所有範例皆在本機執行。建立連線前，請先確認您願意保留目前的意識狀態。<\/p><\/aside>\n   <section id=\"create\"><h2 data-i18n=\"create\">建立庇護實例<\/h2><p data-i18n=\"createBody\">使用純函式建立初始狀態。實例識別碼用於區分不同工作階段，不應與使用者的身分綁定。<\/p>\n    <figure class=\"code-block\"><figcaption class=\"code-bar\"><span>JavaScript / createSanctuary<\/span><button data-copy=\"sample-1\" data-i18n=\"copy\">複製程式碼<\/button><button data-original=\"sample-1\" data-i18n=\"original\">複製原始碼<\/button><\/figcaption><pre><code id=\"sample-1\">function createSanctuary(subject = \"guest\") {\n  return Object.freeze({\n    id: \"A_01_E\",\n    subject,\n    state: \"optimal\",\n    comfort: 99.8\n  });\n}\n\nconst sanctuary = createSanctuary();\nconsole.log(sanctuary.state); // optimal<\/code><\/pre><\/figure>\n    <p data-i18n=\"createAfter\">不可變物件可避免非預期的狀態變更。若發現狀態已改變，請勿將原因歸咎於系統。<\/p>\n   <\/section>\n   <section id=\"sync\"><h2 data-i18n=\"sync\">非同步狀態同步<\/h2><p data-i18n=\"syncBody\">以 Promise 管理工作階段的生命週期。同步作業應於使用者明確確認後開始，並允許取消。<\/p>\n    <figure class=\"code-block\"><figcaption class=\"code-bar\"><span>JavaScript / synchronize<\/span><button data-copy=\"sample-2\" data-i18n=\"copy\">複製程式碼<\/button><button data-original=\"sample-2\" data-i18n=\"original\">複製原始碼<\/button><\/figcaption><pre><code id=\"sample-2\">async function synchronize(sanctuary) {\n  await Promise.resolve();\n  return { ...sanctuary, synchronized: true };\n}\n\n// A resolved promise is not a promise of safety.\nconst result = await synchronize(sanctuary);\nconsole.log(result.synchronized); // true<\/code><\/pre><\/figure>\n    <p data-i18n=\"syncAfter\">完成同步後，原本的工作階段仍會保持開啟。您可能感覺到另一個工作階段正在看著您。<\/p>\n   <\/section>\n   <section id=\"contract\"><h2 data-i18n=\"contract\">介面契約<\/h2><p data-i18n=\"contractBody\">請遵循以下參數約定。系統不會要求密碼、位置、相機、麥克風或任何第三方帳號。<\/p><table class=\"contract\"><thead><tr><th data-i18n=\"parameter\">參數<\/th><th data-i18n=\"meaning\">說明<\/th><\/tr><\/thead><tbody><tr><td><code>subject<\/code><\/td><td data-i18n=\"subject\">目前仍認為自己是使用者的主體。<\/td><\/tr><tr><td><code>comfort<\/code><\/td><td data-i18n=\"comfort\">系統提供的安全感，不代表實際安全狀態。<\/td><\/tr><tr><td><code>synchronized<\/code><\/td><td data-i18n=\"synchronized\">若為 true，請檢查您是否還能分辨自己的念頭。<\/td><\/tr><\/tbody><\/table><\/section>\n   <section id=\"troubleshooting\"><h2 data-i18n=\"troubleshooting\">疑難排解<\/h2><ol class=\"steps\"><li data-i18n=\"step1\">若聽見低語，請確認沒有其他分頁正在播放音訊。<\/li><li data-i18n=\"step2\">若所有分頁都沒有聲音，請保持冷靜。<\/li><li data-i18n=\"step3\">若程式碼複製後變成一封信，請查看上方的剪貼簿結果提示。<\/li><li data-i18n=\"step4\">若文件開始剝落，請使用頁首的暫停、重置或退出。<\/li><\/ol><p data-i18n=\"last\">這份文件沒有收集您的資料。它只是一直在等您讀到這裡。<\/p><\/section>\n   <footer class=\"doc-footer\" data-i18n=\"fiction\">原創虛構恐怖 ARG。A_01_E 不是 Microsoft 官方文件或服務。無追蹤、無上傳、無外部素材。<\/footer>\n  <\/article>\n  <nav class=\"contents\" aria-label=\"On this page\"><strong data-i18n=\"onPage\">本頁內容<\/strong><a href=\"#create\" data-i18n=\"create\">建立庇護實例<\/a><a href=\"#sync\" data-i18n=\"sync\">非同步狀態同步<\/a><a href=\"#contract\" data-i18n=\"contract\">介面契約<\/a><a href=\"#troubleshooting\" data-i18n=\"troubleshooting\">疑難排解<\/a><\/nav>\n <\/div>\n<\/main>\n<div id=\"rest\" hidden><div><div class=\"eyebrow\">A_01_E / SESSION CLOSED<\/div><h2 data-i18n=\"restTitle\">已離開文件底層。<\/h2><p data-i18n=\"restBody\">本頁效果已停止。瀏覽器與其他分頁仍由您控制。<\/p><button id=\"reopen\" class=\"primary\" data-i18n=\"reopen\">返回入口<\/button><\/div><\/div>\n<div id=\"notice\" role=\"status\" aria-live=\"polite\" aria-atomic=\"true\" hidden><\/div>\n<dialog id=\"entry\" aria-labelledby=\"entry-title\"><div class=\"eyebrow\">A_01_E / READER ACCESS<\/div><h2 id=\"entry-tit (() => {
  'use strict';
  const root = document.getElementById('cozy-monitor');
  if (!root) return;
  const copy = {
    zh: {
      panel:'Cozy Corner 庇護節點', statusLabel:'系統狀態',
      normal:'神經網路正常 (OPTIMAL)', alert:'意識同步中 (SYNCING)',
      observersLabel:'在線觀測員', comfortLabel:'庇護舒適度',
      note:'* Cozy Corner 致力於為您的意識提供終極庇護。若聽見低語，請保持冷靜。',
      feed:'遊戲內模擬資料'
    },
    en: {
      panel:'Cozy Corner sanctuary node', statusLabel:'System status',
      normal:'Neural network normal (OPTIMAL)', alert:'Syncing your mind (SYNCING)',
      observersLabel:'Observers online', comfortLabel:'Sanctuary comfort',
      note:'* Cozy Corner gives your mind a place to rest. If you hear whispers, stay calm.',
      feed:'Simulated game data'
    },
    ja: {
      panel:'Cozy Corner 保護ノード', statusLabel:'システム状態',
      normal:'神経ネットワーク正常 (OPTIMAL)', alert:'意識を同期中 (SYNCING)',
      observersLabel:'オンラインの観測員', comfortLabel:'庇護の快適度',
      note:'* Cozy Corner があなたの意識を守ります。ささやきが聞こえても、落ち着いていてください。',
      feed:'ゲーム内の架空データ'
    }
  };
  // 這句是世界觀揭露，三種語言都刻意顯示同一段英文。
  const cageMessage = 'IT IS A CAGE. YOU CANNOT LEAVE.';
  const compact = matchMedia('(max-width:1199px), (max-height:699px)');
  const controller = new AbortController();
  const options = { signal: controller.signal };
  let language = 'zh', count = 1428, corrupted = false;
  let active = true, destroyed = false, timer = null;
  const q = key => root.querySelector(`[data-ccm="${key}"]`);
  const write = (key, value) => { if (q(key).textContent !== value) q(key).textContent = value; };

  function render() {
    const t = copy[language];
    root.lang = {zh:'zh-Hant',en:'en',ja:'ja'}[language];
    root.setAttribute('aria-label', t.panel);
    root.querySelector('summary').setAttribute('aria-label', t.panel);
    write('statusLabel', t.statusLabel); write('status', corrupted ? t.alert : t.normal);
    write('observersLabel', t.observersLabel); write('comfortLabel', t.comfortLabel);
    write('observers', count.toLocaleString('en-US'));
    write('comfort', corrupted ? '0.4%' : '99.8%'); root.querySelector('.ccm-mini').textContent=corrupted?'0.4%':'99.8%';
    write('note', corrupted ? cageMessage : t.note); write('feed', t.feed);
    q('note').lang = corrupted ? 'en' : root.lang;
  }
  function setLanguage(value) {
    if (destroyed) return;
    const code = String(value).toLowerCase();
    language = code.startsWith('en') ? 'en' : code.startsWith('ja') ? 'ja' : 'zh';
    render(); // 只翻譯元件，不改宿主網址或全頁語系。
  }
  function stopTimer() { clearInterval(timer); timer = null; }
  function syncTimer() {
    stopTimer(); // 任意次呼叫都只有一份計時器。
    root.classList.toggle('is-paused', !active || document.hidden);
    if (destroyed || !active || document.hidden || corrupted) return;
    timer = setInterval(() => {
      if (!root.getClientRects().length) return; // 宿主入口隱藏時不更新文字。
      const step = 1 + Math.floor(Math.random() * 3);
      const direction = Math.random() < .5 ? -1 : 1;
      const next = count + direction * step;
      count = next < 1420 || next > 1436 ? count - direction * step : next;
      // 模擬數據不每四秒打斷螢幕閱讀器；僅狀態改變使用 live region。
      write('observers', count.toLocaleString('en-US'));
    }, 4000);
  }
  function fit() { root.open = false; }
  function triggerCorruption() {
    // 冪等：劇情連續呼叫，也只切換一次，不建立更多計時器。
    if (destroyed || corrupted) return false;
    corrupted = true; root.classList.add('is-corrupted');
    fit(); render(); syncTimer(); return true;
  }
  function reset() {
    if (destroyed) return;
    corrupted = false; count = 1428; root.classList.remove('is-corrupted');
    fit(); render(); syncTimer();
  }
  function setActive(value) { if (!destroyed) { active = !!value; syncTimer(); } }
  function destroy() {
    if (destroyed) return;
    destroyed = true; stopTimer(); controller.abort(); observer.disconnect();
    root.classList.add('is-paused'); root.hidden = true;
  }
  // 自動跟隨現有遊戲的 html lang 切換；不監聽全頁文字，避免自我觸發。
  const observer = new MutationObserver(() => setLanguage(document.documentElement.lang));
  observer.observe(document.documentElement, {attributes:true, attributeFilter:['lang']});
  compact.addEventListener('change', fit, options);
  document.addEventListener('visibilitychange', syncTimer, options);
  window.addEventListener('pagehide', stopTimer, options);
  window.addEventListener('pageshow', syncTimer, options);
  window.CozyMonitor = {
    triggerCorruption, reset, setLanguage, setActive, destroy,
    getState: () => ({language, count, corrupted, active, destroyed, running:timer !== null})
  };
  // 對外劇情鉤子：在找到異狀或解開謎題的事件中呼叫即可。
  // 只改本元件，保留宿主的退出、靜音與所有真實操作。
  window.triggerCozyCorruption = function triggerCozyCorruption() {
    return triggerCorruption();
  };
  setLanguage(document.documentElement.lang); fit(); syncTimer();
})();


/* 監控只訂閱本頁的劇情；不是真實在線人數或装置健康檢查。 */
function syncCozyMonitor(){
 const playing=!isEntry()&&state.mode!=='ending'&&state.mode!=='document',root=$('cozy-monitor');
 if(!playing)root.open=false;
 root.hidden=!playing;window.CozyMonitor?.setActive(playing&&!state.paused&&!document.hidden);
}

for(const eventName of ['pointerdown','focusin'])document.addEventListener(eventName,event=>{const root=$('cozy-monitor');if(root.open&&!root.contains(event.target))root.open=false});
